name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install runtime dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Run SSE MCP, REST and stdio tests
        run: npm test
